server:
  port: ${PORT:8080}

spring:
  application:
    name: finance-app

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financeapp}
    username: ${DB_USERNAME:financeapp}
    password: ${DB_PASSWORD:financeapp}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # o schema é controlado pelo Flyway, nunca pelo Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-.env-it-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Usuário único do app (você + sua esposa usam o mesmo login). Criado
  # automaticamente na primeira subida com o banco vazio - ver MasterUserSeeder.
  master-user:
    name: ${MASTER_USER_NAME:}
    email: ${MASTER_USER_EMAIL:}
    password: ${MASTER_USER_PASSWORD:}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    com.financeapp: INFO
